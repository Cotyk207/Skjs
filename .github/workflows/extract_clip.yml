name: Extract Video Clip (29:30 - 32:26)

on:
  push:
    branches:
      - "arena/dc5c016f-skjs"
    paths:
      - ".github/workflows/extract_clip.yml"
  workflow_dispatch:

concurrency:
  group: extract-clip-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extract-clip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up yt-dlp in virtualenv
        run: |
          set -e
          which ffmpeg && ffmpeg -version | head -n 1
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --upgrade --pre "yt-dlp[default,curl-cffi]"
          /tmp/venv/bin/yt-dlp --version

      - name: Download and cut 29:30 - 32:26
        run: |
          set -e
          YTDLP="/tmp/venv/bin/yt-dlp"
          OUT="supernatural_s08e23_29m30s_32m26s.mp4"
          if [ -f "$OUT" ]; then
            echo "Clip $OUT already exists, skipping."
            exit 0
          fi

          URLS=(
            "https://vkvideo.ru/video-221125343_456265914"
            "https://vk.com/video-221125343_456265914"
            "https://m.vkvideo.ru/video-221125343_456265914"
          )

          SUCCESS=0
          for URL in "${URLS[@]}"; do
            echo "=== Probing formats for $URL ==="
            timeout 30 "$YTDLP" --no-playlist --socket-timeout 15 --impersonate chrome -F "$URL" || \
              timeout 30 "$YTDLP" --no-playlist --socket-timeout 15 -F "$URL" || true

            echo "=== Attempt 1: fast section download from $URL ==="
            rm -f /tmp/section_clip.*
            if timeout 120 "$YTDLP" --no-playlist \
              --socket-timeout 15 --retries 3 \
              --download-sections "*29:30-32:26" \
              --force-keyframes-at-cuts \
              -f "bv*[height<=720]+ba/b[height<=720]/b" \
              --merge-output-format mp4 \
              -o "/tmp/section_clip.%(ext)s" \
              "$URL"; then
              CANDIDATE=$(ls /tmp/section_clip.* 2>/dev/null | head -n 1 || true)
              if [ -n "$CANDIDATE" ] && [ -s "$CANDIDATE" ]; then
                DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$CANDIDATE" || echo "0")
                DUR_INT=${DUR%.*}
                echo "Downloaded section duration: ${DUR}s"
                if [ "${DUR_INT:-0}" -ge 165 ] && [ "${DUR_INT:-0}" -le 190 ]; then
                  mv "$CANDIDATE" /tmp/ready_clip.mp4
                  SUCCESS=1
                  break
                fi
              fi
            fi

            echo "=== Attempt 2: full <=720p download (8 threads) + local ffmpeg cut ==="
            rm -f /tmp/full_video.*
            if timeout 210 "$YTDLP" --no-playlist \
              --socket-timeout 15 --retries 3 \
              -N 8 \
              -f "bv*[height<=720]+ba/b[height<=720]/b" \
              --merge-output-format mp4 \
              -o "/tmp/full_video.%(ext)s" \
              "$URL"; then
              FULL_FILE=$(ls /tmp/full_video.* 2>/dev/null | head -n 1 || true)
              if [ -n "$FULL_FILE" ] && [ -s "$FULL_FILE" ]; then
                ffmpeg -y -ss 1770 -i "$FULL_FILE" -t 176 \
                  -c:v libx264 -preset veryfast -crf 22 \
                  -c:a aac -b:a 160k \
                  -movflags +faststart \
                  /tmp/ready_clip.mp4
                rm -f "$FULL_FILE"
                if [ -s /tmp/ready_clip.mp4 ]; then
                  SUCCESS=1
                  break
                fi
              fi
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Failed to download video from VK Video on runner."
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s /tmp/ready_clip.mp4)
          echo "Clip size: $SIZE_BYTES bytes"
          if [ "$SIZE_BYTES" -gt 94371840 ]; then
            echo "Re-encoding to fit under 90 MB..."
            ffmpeg -y -i /tmp/ready_clip.mp4 \
              -c:v libx264 -preset veryfast -b:v 3500k -maxrate 4200k -bufsize 7000k \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "$OUT"
            rm -f /tmp/ready_clip.mp4
          else
            mv /tmp/ready_clip.mp4 "$OUT"
          fi

          ls -lh "$OUT"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$OUT"

      - name: Commit and push clip to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supernatural_s08e23_29m30s_32m26s.mp4
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Add video clip (29:30-32:26) from video-221125343_456265914"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
